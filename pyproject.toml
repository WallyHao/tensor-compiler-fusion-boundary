[project]
name = "fusionboundary"
version = "0.1.0"
description = "Fusion Boundaries: corpus, split/fused TorchInductor candidates and edge evidence (RTX 4090 phase 1)"
requires-python = ">=3.12"
dependencies = ["torch==2.6.0", "triton==3.2.0"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.package-dir]
fusionboundary = "src/fusionboundary"

[tool.setuptools]
packages = ["fusionboundary", "fb", "fusionaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA device", "slow: compiles with TorchInductor"]
addopts = "-q"
